<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="ig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square container -->
  <rect width="32" height="32" rx="7" fill="url(#ig)"/>
  <!-- Pupil -->
  <circle cx="16" cy="16" r="6" fill="#fafafa" opacity="0.95"/>
  <!-- A letterform -->
  <text x="16" y="19.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#6366f1">A</text>
  <!-- Single scan arc for clarity at small size -->
  <path d="M22 9 A9 9 0 0 1 28 15" stroke="#fafafa" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>
